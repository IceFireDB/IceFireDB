# refmt makes deliberate use of dot imports for the `tok` package so that
# token-type references (TString, TArrOpen, etc.) read tersely throughout
# the codebase. ST1001 (do not use dot imports) flags this as a style
# violation in ~42 files; opting out keeps the existing aesthetic until a
# future cleanup chooses to convert.
#
# The other suppressed checks (ST1000, ST1003, ST1016, ST1020, ST1021,
# ST1022) match staticcheck's own default exclusions for stylistic checks
# that aren't on by default; they are listed explicitly here because using
# "all" as the base re-enables them.
checks = [
	"all",
	"-ST1000",
	"-ST1001",
	"-ST1003",
	"-ST1016",
	"-ST1020",
	"-ST1021",
	"-ST1022",
]
