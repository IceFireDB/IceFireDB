on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: Test
jobs:
  osstest:
    strategy:
      matrix:
        go-version: [1.25.2]
        os: [ubuntu-latest]
        arch: [amd64, arm64, armv5, armv6, armv7]
    runs-on: ${{ matrix.os }}
    env:
      DRIVER: oss
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: go mod tidy && go mod vendor
      - name: Start MinIO
        run: |
          # Pull the official MinIO image from Docker Hub. The previous `quay.io/minio/minio`
          # image is no longer publicly available and caused "unauthorized" pull failures.
          # Pin a specific release tag (not `:latest`) so CI stays reproducible across builds.
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e "MINIO_ROOT_USER=AKIAIOSFODNN7EXAMPLE" \
            -e "MINIO_ROOT_PASSWORD=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" \
            minio/minio:RELEASE.2024-09-13T20-26-02Z \
            server /data --console-address ":9001"
          # Wait for MinIO to be ready before tests connect to it.
          for i in {1..30}; do
            curl -sf http://localhost:9000/minio/health/ready && break || sleep 1
          done
      - name: Test
        run: go test -v -count=1 -tags="alltest osstest"

  ipfstest:
    strategy:
      matrix:
        go-version: [1.25.2]
        os: [ubuntu-latest]
        arch: [amd64, arm64, armv5, armv6, armv7]
    runs-on: ${{ matrix.os }}
    env:
      DRIVER: ipfs
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: go mod tidy && go mod vendor
      - name: Setup Ipfs daemon 
        run: |
          sudo mkdir -p /root/ipfs_staging
          sudo mkdir -p /root/ipfs_data
          export ipfs_staging=/root/ipfs_staging
          export ipfs_data=/root/ipfs_data 
          docker run -d --name ipfs_host -v $ipfs_staging:/export -v $ipfs_data:/data/ipfs -p 4001:4001 -p 8080:8080 -p 5001:5001 ipfs/kubo:latest
      - name: Test
        run: go test -v -count=1 -tags alltest


