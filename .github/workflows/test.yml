on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: Test
jobs:
  osstest:
    strategy:
      matrix:
        go-version: [1.25.2]
        os: [ubuntu-latest]
        arch: [amd64, arm64, armv5, armv6, armv7]
    runs-on: ${{ matrix.os }}
    env:
      DRIVER: oss
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: go mod tidy && go mod vendor
      - name: Start LocalStack
        # Use LocalStack as the S3-compatible test server. The previous MinIO
        # image (quay.io/minio/minio) requires authentication and is no longer
        # anonymously pullable, breaking this job across all architectures.
        # LocalStack ships a built-in `awslocal` CLI we use to create the
        # bucket the OSS driver test expects.
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e "SERVICES=s3" \
            -e "DEFAULT_REGION=us-east-1" \
            localstack/localstack:3.0
          # Wait for LocalStack's S3 to become available and create the bucket.
          # awslocal itself retries, but we wrap it in a loop so a slow start
          # doesn't crash the workflow.
          for i in {1..60}; do
            docker exec localstack awslocal s3 mb s3://gokv 2>/dev/null && break
            sleep 1
          done
      - name: Test
        run: OSS_TEST_ENDPOINT=http://localhost:4566 go test -v -count=1 -tags="alltest osstest"

  ipfstest:
    strategy:
      matrix:
        go-version: [1.25.2]
        os: [ubuntu-latest]
        arch: [amd64, arm64, armv5, armv6, armv7]
    runs-on: ${{ matrix.os }}
    env:
      DRIVER: ipfs
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: go mod tidy && go mod vendor
      - name: Setup Ipfs daemon 
        run: |
          sudo mkdir -p /root/ipfs_staging
          sudo mkdir -p /root/ipfs_data
          export ipfs_staging=/root/ipfs_staging
          export ipfs_data=/root/ipfs_data 
          docker run -d --name ipfs_host -v $ipfs_staging:/export -v $ipfs_data:/data/ipfs -p 4001:4001 -p 8080:8080 -p 5001:5001 ipfs/kubo:latest
      - name: Test
        run: go test -v -count=1 -tags alltest


